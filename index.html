<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DERKAT DASHBOARD</title>

<style>
body{
font-family:Arial;
margin:0;
background:#0f172a;
color:white;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:white;
color:black;
padding:15px;
margin:10px 0;
border-radius:10px;
}

button{
padding:10px;
background:red;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}
</style>
</head>

<body onload="loadDashboard()">

<div class="container">

<h2>DERKAT DASHBOARD</h2>

<div id="content"></div>

<button onclick="logout()">Logout</button>

</div>

<script>

function loadDashboard(){

let role = localStorage.getItem("role");
let user = JSON.parse(localStorage.getItem("user") || "{}");

if(!role){
window.location.href = "index.html";
return;
}

/* STUDENT DASHBOARD */
if(role === "student"){

document.getElementById("content").innerHTML = `
<div class="card">
<h3>Student Dashboard</h3>
<p><b>Name:</b> ${user.fullName}</p>
<p><b>Email:</b> ${user.email}</p>
<p><b>Program:</b> ${user.program}</p>
<p><b>Semester:</b> ${user.semester}</p>
<p><b>Status:</b> ${user.premium}</p>
</div>
`;

}

/* TUTOR DASHBOARD */
if(role === "tutor"){

document.getElementById("content").innerHTML = `
<div class="card">
<h3>Tutor Dashboard</h3>
<p>Welcome Admin</p>

<button onclick="loadStudents()">Load Students</button>

<div id="students"></div>
</div>
`;

}

}

/* LOAD STUDENTS (TUTOR ONLY) */
function loadStudents(){

fetch("https://script.google.com/macros/s/AKfycbw3A3X0Gwz1W9Ie6PPY9tagtEAx_08kAu8FOmUoRRll8YpnCaO7cr5dxqZZI0TTfSYi/exec",{
method:"POST",
body:JSON.stringify({action:"getStudents"})
})
.then(r=>r.json())
.then(data=>{

document.getElementById("students").innerHTML =
data.map(s=>`
<div class="card">
<b>${s.fullName}</b><br>
${s.email}<br>
${s.program}<br>
Status: ${s.premium}
</div>
`).join("");

});

}

/* LOGOUT */
function logout(){
localStorage.clear();
window.location.href = "index.html";
}

</script>

</body>
</html>
