<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DERKAT PREMIUM REVISIONS</title>

<style>
body{
font-family:Arial;
margin:0;
background:#0f172a;
color:white;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
color:black;
padding:15px;
margin:10px 0;
border-radius:10px;
}

input, select{
width:100%;
padding:10px;
margin:6px 0;
border-radius:6px;
border:1px solid #ccc;
}

button{
width:100%;
padding:10px;
margin-top:10px;
background:#16a34a;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
}

.nav button{
width:auto;
margin:5px;
background:#334155;
}

.hidden{display:none;}

h2{text-align:center;}
</style>
</head>

<body>

<div class="container">

<h2>DERKAT PREMIUM REVISIONS</h2>

<!-- NAV -->
<div class="nav">
<button onclick="show('register')">Register</button>
<button onclick="show('login')">Login</button>
<button onclick="show('forgot')">Forgot</button>
<button onclick="show('tutor')">Tutor</button>
<button onclick="show('dash')">Dashboard</button>
</div>

<!-- REGISTER -->
<div class="card" id="registerBox">

<h2>Student Registration</h2>

<input type="text" id="studentId" readonly>

<input type="text" id="fullName" placeholder="Full Name">
<input type="email" id="email" placeholder="Email">
<input type="text" id="phone" placeholder="Phone Number">

<select id="gender">
<option>Male</option>
<option>Female</option>
</select>

<input type="text" id="institution" placeholder="Institution">

<select id="program">
<option>Diploma in Clinical Medicine</option>
<option>Degree in Clinical Medicine</option>
<option>Nursing</option>
</select>

<select id="semester">
<option>Semester 1</option>
<option>Semester 2</option>
<option>Semester 3</option>
<option>Semester 4</option>
<option>Semester 5</option>
<option>Semester 6</option>
</select>

<input type="password" id="password" placeholder="Create Password">

<button onclick="registerStudent()">Register Student</button>

</div>

<!-- LOGIN -->
<div class="card hidden" id="loginBox">

<h2>Student Login</h2>

<input type="email" id="loginEmail" placeholder="Email">
<input type="password" id="loginPassword" placeholder="Password">

<button onclick="loginStudent()">Login</button>

</div>

<!-- FORGOT -->
<div class="card hidden" id="forgotBox">

<h2>Forgot Password</h2>

<input type="email" id="forgotEmail" placeholder="Enter Email">

<button onclick="forgotPassword()">Reset Password</button>

</div>

<!-- DASHBOARD -->
<div class="card hidden" id="dashBox">

<h2>Student Dashboard</h2>
<div id="dashData"></div>

<button onclick="logout()">Logout</button>

</div>

<!-- TUTOR -->
<div class="card hidden" id="tutorBox">

<h2>Tutor Panel</h2>

<button onclick="loadStudents()">Load Students</button>

<div id="studentsList"></div>

</div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbw3A3X0Gwz1W9Ie6PPY9tagtEAx_08kAu8FOmUoRRll8YpnCaO7cr5dxqZZI0TTfSYi/exec";

// NAV SWITCH
function show(page){

["registerBox","loginBox","forgotBox","dashBox","tutorBox"].forEach(id=>{
document.getElementById(id).classList.add("hidden");
});

document.getElementById(page+"Box").classList.remove("hidden");
}

// AUTO ID
function generateID(){
document.getElementById("studentId").value =
"DPR-" + Date.now();
}
generateID();

// REGISTER
function registerStudent(){

fetch(API_URL,{
method:"POST",
body:JSON.stringify({
action:"register",
fullName:fullName.value,
email:email.value,
phone:phone.value,
gender:gender.value,
institution:institution.value,
program:program.value,
semester:semester.value,
password:password.value
})
})
.then(r=>r.json())
.then(res=>{
alert("Registered ID: "+res.studentId);
generateID();
});
}

// LOGIN
function loginStudent(){

fetch(API_URL,{
method:"POST",
body:JSON.stringify({
action:"login",
email:loginEmail.value,
password:loginPassword.value
})
})
.then(r=>r.json())
.then(res=>{

if(res.status==="success"){

localStorage.setItem("student",JSON.stringify(res.student));

document.getElementById("dashData").innerHTML=`
<h3>Welcome ${res.student.fullName}</h3>
<p>ID: ${res.student.studentId}</p>
<p>Email: ${res.student.email}</p>
<p>Program: ${res.student.program}</p>
<p>Semester: ${res.student.semester}</p>
<p>Status: ${res.student.premium}</p>
`;

show("dash");

}else{
alert("Login failed");
}

});
}

// FORGOT PASSWORD
function forgotPassword(){

fetch(API_URL,{
method:"POST",
body:JSON.stringify({
action:"forgot",
email:forgotEmail.value
})
})
.then(r=>r.json())
.then(res=>{
alert(res.message);
});

}

// TUTOR PANEL
function loadStudents(){

fetch(API_URL,{
method:"POST",
body:JSON.stringify({action:"getStudents"})
})
.then(r=>r.json())
.then(data=>{

document.getElementById("studentsList").innerHTML =
data.map(s=>`
<div class="card">
<b>${s.fullName}</b><br>
${s.email}<br>
${s.program} - Sem ${s.semester}<br>
Status: ${s.premium}
</div>
`).join("");

});

}

// LOGOUT
function logout(){
localStorage.clear();
show("login");
}

</script>

</body>
</html>
