<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DERKAT PREMIUM REVISIONS</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f4f6f9;
}

header{
    background:#0f172a;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:90%;
    max-width:900px;
    margin:auto;
    margin-top:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    margin-bottom:20px;
}

h2{
    color:#0f172a;
}

input, select{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:6px;
    background:#16a34a;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#15803d;
}

.nav{
    display:flex;
    justify-content:space-around;
    background:#1e293b;
    padding:10px;
}

.nav button{
    width:auto;
    background:#334155;
}
</style>
</head>

<body>

<header>
    <h1>DERKAT PREMIUM REVISIONS</h1>
    <p>Student Management Portal</p>
</header>

<div class="nav">
    <button onclick="showStudent()">Student Register</button>
    <button onclick="showTutor()">Tutor Login</button>
</div>

<div class="container">

<!-- STUDENT REGISTRATION -->
<div class="card" id="studentBox">
<h2>Student Registration</h2>

<input type="text" id="name" placeholder="Full Name">
<input type="email" id="email" placeholder="Email">
<input type="text" id="phone" placeholder="Phone Number">

<select id="gender">
<option>Male</option>
<option>Female</option>
</select>

<input type="text" id="course" placeholder="Course">
<input type="text" id="semester" placeholder="Semester">
<input type="password" id="password" placeholder="Create Password">

<button onclick="registerStudent()">Register</button>
</div>

<!-- TUTOR LOGIN -->
<div class="card" id="tutorBox" style="display:none;">
<h2>Tutor Login</h2>

<input type="text" id="username" placeholder="Username">
<input type="password" id="tpass" placeholder="Password">
<input type="text" id="access" placeholder="Access Code">

<button onclick="tutorLogin()">Login</button>
</div>

</div>

<script>

// SWITCH PANELS
function showStudent(){
document.getElementById("studentBox").style.display="block";
document.getElementById("tutorBox").style.display="none";
}

function showTutor(){
document.getElementById("studentBox").style.display="none";
document.getElementById("tutorBox").style.display="block";
}

// STUDENT REGISTER (TEMP LOCAL STORAGE)
function registerStudent(){

let student = {
name: document.getElementById("name").value,
email: document.getElementById("email").value,
phone: document.getElementById("phone").value,
gender: document.getElementById("gender").value,
course: document.getElementById("course").value,
semester: document.getElementById("semester").value
};

let data = JSON.parse(localStorage.getItem("students") || "[]");
data.push(student);
localStorage.setItem("students", JSON.stringify(data));

alert("Student Registered Successfully (Saved Locally)");
}

// TUTOR LOGIN (DUMMY CHECK FOR NOW)
function tutorLogin(){

let username = document.getElementById("username").value;
let pass = document.getElementById("tpass").value;
let code = document.getElementById("access").value;

// temporary demo credentials
if(username==="admin" && pass==="1234" && code==="DPR2026"){
alert("Tutor Login Successful");
} else {
alert("Invalid Credentials");
}
}

</script>

</body>
</html>
