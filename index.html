<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DERKAT PREMIUM REVISIONS</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f4f6f9;
}

header{
    background:#0f172a;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:90%;
    max-width:900px;
    margin:auto;
    margin-top:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    margin-bottom:20px;
}

h2{ color:#0f172a; }

input, select{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:6px;
    background:#16a34a;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#15803d;
}

.nav{
    display:flex;
    justify-content:space-around;
    background:#1e293b;
    padding:10px;
}

.nav button{
    width:auto;
    background:#334155;
}

img{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    display:none;
    margin-top:10px;
}
</style>
</head>

<body>

<header>
    <h1>DERKAT PREMIUM REVISIONS</h1>
    <p>Student Management Portal</p>
</header>

<div class="nav">
    <button onclick="showStudent()">Student Register</button>
    <button onclick="showTutor()">Tutor Login</button>
</div>

<div class="container">

<!-- STUDENT -->
<div class="card" id="studentBox">

<h2>Student Registration</h2>

<input type="text" id="studentId" readonly>

<input type="text" id="fullName" placeholder="Full Name">
<input type="email" id="email" placeholder="Email">
<input type="text" id="phone" placeholder="Phone Number">

<select id="gender">
<option>Male</option>
<option>Female</option>
</select>

<input type="text" id="institution" placeholder="Institution / College">

<select id="program">
<option>Diploma in Clinical Medicine</option>
<option>Degree in Clinical Medicine</option>
<option>Nursing</option>
</select>

<select id="semester">
<option>Semester 1</option>
<option>Semester 2</option>
<option>Semester 3</option>
<option>Semester 4</option>
<option>Semester 5</option>
<option>Semester 6</option>
</select>

<input type="password" id="password" placeholder="Create Password">

<label>Profile Photo</label>
<input type="file" accept="image/*" onchange="loadPhoto(event)">
<img id="preview">

<button onclick="registerStudent()">Register Student</button>

</div>

<!-- TUTOR -->
<div class="card" id="tutorBox" style="display:none;">

<h2>Tutor Login</h2>

<input type="text" id="username" placeholder="Username">
<input type="password" id="tpass" placeholder="Password">
<input type="text" id="access" placeholder="Access Code">

<button onclick="tutorLogin()">Login</button>

</div>

</div>

<script>

// AUTO ID
function generateID(){
document.getElementById("studentId").value =
"DPR-" + Date.now();
}
generateID();

// SWITCH
function showStudent(){
document.getElementById("studentBox").style.display="block";
document.getElementById("tutorBox").style.display="none";
}

function showTutor(){
document.getElementById("studentBox").style.display="none";
document.getElementById("tutorBox").style.display="block";
}

// PHOTO PREVIEW
function loadPhoto(event){
let img = document.getElementById("preview");
img.src = URL.createObjectURL(event.target.files[0]);
img.style.display="block";
}

// REGISTER (GOOGLE SHEETS VERSION)
function registerStudent(){

if(!fullName.value || !email.value || !phone.value){
alert("Please fill all required fields");
return;
}

let student = {
studentId: studentId.value,
fullName: fullName.value,
email: email.value,
phone: phone.value,
gender: gender.value,
institution: institution.value,
program: program.value,
semester: semester.value,
password: password.value
};

fetch("https://script.google.com/macros/s/AKfycbw3A3X0Gwz1W9Ie6PPY9tagtEAx_08kAu8FOmUoRRll8YpnCaO7cr5dxqZZI0TTfSYi/exec", {
method: "POST",
body: JSON.stringify(student)
})
.then(res => res.json())
.then(data => {

if(data.status === "success"){
alert("Registration Successful!\nYour Student ID: " + data.studentId);
clearForm();
generateID();
} else {
alert("Registration failed");
}

})
.catch(error => {
alert("Error connecting to server");
console.log(error);
});

}

// CLEAR FORM
function clearForm(){
fullName.value="";
email.value="";
phone.value="";
institution.value="";
password.value="";
preview.style.display="none";
}

// TUTOR LOGIN
function tutorLogin(){

if(username.value==="admin" && tpass.value==="1234" && access.value==="DPR2026"){
alert("Tutor Login Successful");
} else {
alert("Invalid Credentials");
}
}

</script>

</body>
</html>
<div class="card">

<h2>Student Login</h2>

<input type="email" id="loginEmail" placeholder="Email">
<input type="password" id="loginPassword" placeholder="Password">

<button onclick="loginStudent()">Login</button>

</div>
